<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sarah, your virtual assistant">
  <circle cx="32" cy="32" r="32" fill="#015ee8"/>
  <circle cx="32" cy="32" r="32" fill="url(#sarah-bg-gradient)" fill-opacity="0.15"/>
  <defs>
    <linearGradient id="sarah-bg-gradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- shoulders -->
  <path d="M10 62c1.5-11 9.8-19 22-19s20.5 8 22 19" fill="#1c2b4a"/>

  <!-- neck -->
  <rect x="27" y="38" width="10" height="10" rx="4" fill="#c98a5e"/>

  <!-- hair back -->
  <path d="M16 30c0-11 7.2-19 16-19s16 8 16 19c0 3-.5 6-1.4 8.6-1.6-1-3-3.2-3.4-6.6-1 3-3.6 5-6.8 5.6.6-1.6.8-3.4.6-5.2-2.4 2.8-6.6 4.2-10 3-.4 2-1.6 3.8-3.2 5-2-1.6-3.2-4-3.6-6.6-1.6 1.4-3.6 2.2-5.6 2.2-.4-2-.6-4-.6-6z" fill="#20242c"/>

  <!-- face -->
  <ellipse cx="32" cy="29" rx="13" ry="14" fill="#c98a5e"/>

  <!-- hair front -->
  <path d="M19 27c-.6-8.4 5.4-15 13-15s13.6 6.6 13 15c-2.6-3-6-5-9-4.6.8-1.4 1-3 .6-4.4-2.4 3-6.6 4.4-10.4 3.4.4 1.8.2 3.6-.6 5.2-2.6-.4-5-2-6.6 .4z" fill="#20242c"/>

  <!-- ears -->
  <circle cx="19.5" cy="30" r="2.6" fill="#c98a5e"/>
  <circle cx="44.5" cy="30" r="2.6" fill="#c98a5e"/>

  <!-- blush -->
  <circle cx="24.5" cy="33" r="2.4" fill="#e8996f" fill-opacity="0.5"/>
  <circle cx="39.5" cy="33" r="2.4" fill="#e8996f" fill-opacity="0.5"/>

  <!-- eyes -->
  <path d="M22 27.5c1.4-1.2 3.6-1.2 5 0" stroke="#20242c" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M37 27.5c1.4-1.2 3.6-1.2 5 0" stroke="#20242c" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- smile -->
  <path d="M26 35.5c2.6 2.4 9.4 2.4 12 0" stroke="#7a4326" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>
